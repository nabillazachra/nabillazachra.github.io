name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SANITY_STUDIO_PROJECT_ID: ci000001
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install expressive QA tools
        run: |
          npm install --no-save playwright@1.55.0 serve@14
          npx playwright install --with-deps chromium
      - name: Verify expressive art direction
        run: |
          npx serve apps/web/out -l 4173 > /tmp/portfolio-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node apps/web/scripts/expressive-qa.mjs
      - name: Upload expressive QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: expressive-qa
          path: |
            /tmp/expressive-hero-desktop.png
            /tmp/expressive-work-desktop.png
            /tmp/expressive-method-desktop.png
            /tmp/expressive-private-desktop.png
            /tmp/expressive-hero-mobile.png
            /tmp/expressive-work-mobile.png
            /tmp/expressive-private-mobile.png
