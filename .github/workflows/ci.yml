name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SANITY_STUDIO_PROJECT_ID: ci000001
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser for visual QA
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture portfolio screenshots
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa/desktop visual-qa/mobile
          python3 -m http.server 4173 --directory apps/web/out >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const routes = [
            ['home', '/'],
            ['ferizy', '/work/ferizy-usability-testing/'],
            ['workhub', '/work/workhub-attendance/'],
            ['onstreet', '/work/onstreet-parking/'],
            ['jago', '/work/jago-last-wish/'],
          ];

          async function warmLazyImages(page) {
            await page.evaluate(async () => {
              const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              const height = document.documentElement.scrollHeight;
              for (let y = 0; y < height; y += 700) {
                window.scrollTo(0, y);
                await delay(80);
              }
              window.scrollTo(0, 0);
              await delay(250);
            });
          }

          async function capture(browser, name, route, viewport, folder) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'networkidle' });
            await warmLazyImages(page);
            await page.screenshot({ path: `visual-qa/${folder}/${name}.png`, fullPage: true });
            await context.close();
          }

          (async () => {
            fs.mkdirSync('visual-qa/desktop', { recursive: true });
            fs.mkdirSync('visual-qa/mobile', { recursive: true });
            const browser = await chromium.launch({ headless: true });
            for (const [name, route] of routes) {
              await capture(browser, name, route, { width: 1440, height: 1200 }, 'desktop');
              await capture(browser, name, route, { width: 393, height: 852 }, 'mobile');
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload visual QA artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: visual-qa
          if-no-files-found: error
