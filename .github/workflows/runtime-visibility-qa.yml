name: Runtime visibility QA

on:
  push:
    branches:
      - remove-fragile-scroll-reveal

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build:web

      - name: Install runtime QA tools
        run: |
          npm install --no-save playwright@1.55.0 serve@14
          npx playwright install --with-deps chromium

      - name: Verify content survives hydration and scroll
        run: |
          npx serve apps/web/out -l 4173 > /tmp/portfolio-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require("playwright");

          const labels = [
            "Selected Work",
            "Business → system → experience.",
            "Some of my most recent work cannot live on the internet.",
            "About / Experience",
            "Teaching design, too.",
            "Playground",
            "Have a complex problem to make clearer?",
          ];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

          async function assertContentVisible(stage) {
            for (const label of labels) {
              const locator = page.getByText(label, { exact: true }).first();
              if ((await locator.count()) === 0) {
                throw new Error(stage + ": missing text: " + label);
              }

              const hiddenBy = await locator.evaluate((element) => {
                let node = element;
                while (node) {
                  const style = getComputedStyle(node);
                  if (
                    style.display === "none" ||
                    style.visibility === "hidden" ||
                    Number.parseFloat(style.opacity || "1") <= 0.01
                  ) {
                    return {
                      tag: node.tagName,
                      className: node.className,
                      display: style.display,
                      visibility: style.visibility,
                      opacity: style.opacity,
                    };
                  }
                  node = node.parentElement;
                }
                return null;
              });

              if (hiddenBy) {
                throw new Error(
                  stage + ": " + label + " hidden by " + JSON.stringify(hiddenBy),
                );
              }
            }
          }

          await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
          await assertContentVisible("initial load");

          await page.reload({ waitUntil: "networkidle" });
          await page.waitForTimeout(3500);
          await assertContentVisible("3.5s after reload");

          for (const label of labels) {
            const locator = page.getByText(label, { exact: true }).first();
            await locator.scrollIntoViewIfNeeded();
            await page.waitForTimeout(350);
            const opacity = await locator.evaluate((element) =>
              Number.parseFloat(getComputedStyle(element).opacity || "1"),
            );
            if (opacity <= 0.01) {
              throw new Error("after scroll: invisible text: " + label);
            }
          }

          await page.screenshot({
            path: "/tmp/portfolio-after-hydration.png",
            fullPage: true,
          });

          await browser.close();
          console.log("Runtime visibility QA passed.");
          NODE

      - name: Upload QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: runtime-visibility-qa
          path: /tmp/portfolio-after-hydration.png
